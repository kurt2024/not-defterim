<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Defterim</title>
    <!-- Şık PNG / Emoji Tabanlı Uygulama Simgesi -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📒</text></svg>">
    <style>
        :root {
            --bg-deep: #070913;
            --surface: #0f172a;
            --surface-hover: #1e293b;
            --border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --red: #ef4444;
            --green: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--bg-deep) 0%, #020617 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-logo {
            font-size: 2.2rem;
            background: rgba(59, 130, 246, 0.1);
            padding: 8px 12px;
            border-radius: 14px;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }

        header h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
        }

        header p {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

        .btn-secondary {
            background: var(--surface-hover);
            color: var(--text-main);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover { background: #334155; }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Not Ekleme / Düzenleme Alanı */
        .editor-card {
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 18px;
            display: none;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .form-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            background-color: #020617;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        /* Not Listesi Izgarası */
        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
        }

        .note-item {
            background-color: #0b0f19;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .note-item:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .note-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 8px;
        }

        .note-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
        }

        .note-badge {
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .badge-acil { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge-klinik { background: rgba(59, 130, 246, 0.2); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.3); }
        .badge-idari { background: rgba(245, 158, 11, 0.2); color: #fde68a; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-kisisel { background: rgba(16, 185, 129, 0.2); color: #a7f3d0; border: 1px solid rgba(16, 185, 129, 0.3); }

        .note-body {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.4;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
            font-size: 0.75rem;
            color: #64748b;
        }

        .note-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }
        .icon-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .icon-btn.delete:hover { color: var(--red); background: rgba(239,68,68,0.1); }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            grid-column: 1 / -1;
        }
        .empty-state span { font-size: 2.5rem; display: block; margin-bottom: 8px; }

        @media print {
            body { background: white; color: black; padding: 0; }
            .app-container { box-shadow: none; border: none; padding: 0; max-width: 100%; }
            .actions-bar, .search-box, .editor-card, .note-actions { display: none !important; }
            .note-item { border: 1px solid #cbd5e1; background: #fff; break-inside: avoid; }
            .note-title { color: #0f172a; }
            .note-body { color: #334155; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title">
            <div class="app-logo">📒</div>
            <div>
                <h1>Not Defterim</h1>
                <p>Akıllı Klinik & Paylaşılabilir Notlar</p>
            </div>
        </div>
        <div class="actions-bar">
            <button class="btn btn-secondary" onclick="window.print()" title="Yazdır / PDF Kaydet">
                <span>🖨️</span> Çıktı
            </button>
            <button class="btn btn-primary" onclick="app.openEditor()">
                <span>➕</span> Yeni Not
            </button>
        </div>
    </header>

    <!-- Arama Çubuğu -->
    <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Notlarda ara (başlık veya içerik)..." oninput="app.render()">
    </div>

    <!-- Not Ekleme / Düzenleme Formu -->
    <div class="editor-card" id="editorCard">
        <input type="hidden" id="noteId" value="">
        <div class="form-row">
            <input type="text" id="noteTitle" placeholder="Not Başlığı...">
            <select id="noteCategory">
                <option value="acil">🚨 Acil / Kritik</option>
                <option value="klinik">🩺 Klinik / Vizit</option>
                <option value="idari">📋 İdari / Nöbet</option>
                <option value="kisisel">💡 Kişisel / Fikir</option>
            </select>
        </div>
        <textarea id="noteContent" placeholder="Not içeriğini buraya yazın..."></textarea>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="app.closeEditor()">İptal</button>
            <button class="btn btn-primary" onclick="app.saveNote()">💾 Notu Kaydet</button>
        </div>
    </div>

    <!-- Notların Listelendiği Alan -->
    <div class="notes-grid" id="notesGrid"></div>
</div>

<script>
    class NoteApp {
        constructor() {
            this.notes = [];
            this.loadNotes();
        }

        loadNotes() {
            try {
                const stored = localStorage.getItem('not_defterim_v1');
                if (stored) {
                    this.notes = JSON.parse(stored);
                } else {
                    this.notes = [
                        { id: Date.now(), title: 'Hoş Geldiniz', category: 'acil', content: 'Not Defterim uygulaması ile notlarınızı saklayabilir, yazdırabilir veya tek tıkla herkesle paylaşabilirsiniz.', date: '22.10.2026 10:20' }
                    ];
                    this.saveNotes();
                }
            } catch(e) {
                this.notes = [];
            }
        }

        saveNotes() {
            try {
                localStorage.setItem('not_defterim_v1', JSON.stringify(this.notes));
            } catch(e) {
                console.error("Kayıt hatası:", e);
            }
        }

        openEditor(id = null) {
            const card = document.getElementById('editorCard');
            card.style.display = 'flex';

            if (id !== null) {
                const note = this.notes.find(n => n.id === id);
                if (note) {
                    document.getElementById('noteId').value = note.id;
                    document.getElementById('noteTitle').value = note.title;
                    document.getElementById('noteCategory').value = note.category;
                    document.getElementById('noteContent').value = note.content;
                }
            } else {
                document.getElementById('noteId').value = '';
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('noteCategory').value = 'acil';
            }
            document.getElementById('noteTitle').focus();
        }

        closeEditor() {
            document.getElementById('editorCard').style.display = 'none';
        }

        saveNote() {
            const idVal = document.getElementById('noteId').value;
            const title = document.getElementById('noteTitle').value.trim();
            const category = document.getElementById('noteCategory').value;
            const content = document.getElementById('noteContent').value.trim();

            if (!title && !content) {
                alert('Lütfen en az bir başlık veya içerik giriniz.');
                return;
            }

            const now = new Date();
            const dateStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', {hour: '2-digit', minute:'2-digit'});

            if (idVal !== '') {
                const numericId = Number(idVal);
                const note = this.notes.find(n => n.id === numericId);
                if (note) {
                    note.title = title || 'Başlıksız Not';
                    note.category = category;
                    note.content = content;
                    note.date = dateStr;
                }
            } else {
                const newNote = {
                    id: Date.now(),
                    title: title || 'Başlıksız Not',
                    category: category,
                    content: content,
                    date: dateStr
                };
                this.notes.unshift(newNote);
            }

            this.saveNotes();
            this.closeEditor();
            this.render();
        }

        deleteNote(id) {
            if (confirm('Bu notu silmek istediğinize emin misiniz?')) {
                this.notes = this.notes.filter(n => n.id !== id);
                this.saveNotes();
                this.render();
            }
        }

        shareNote(id) {
            const note = this.notes.find(n => n.id === id);
            if (!note) return;

            const shareText = `📌 *${note.title}*\n\n${note.content}\n\n_Tarih: ${note.date} (Not Defterim)_`;

            // Mobil cihazlarda doğrudan paylaşım menüsü (Web Share API)
            if (navigator.share) {
                navigator.share({
                    title: note.title,
                    text: shareText,
                }).catch(() => {});
            } else {
                // Desteklemeyen tarayıcılarda panoya kopyala
                navigator.clipboard.writeText(shareText).then(() => {
                    alert('Not panoya kopyalandı! İstediğiniz yerde yapıştırıp paylaşabilirsiniz.');
                }).catch(() => {
                    alert('Paylaşım başarısız oldu.');
                });
            }
        }

        render() {
            const grid = document.getElementById('notesGrid');
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput ? searchInput.value.toLowerCase() : '';

            const filtered = this.notes.filter(n => 
                n.title.toLowerCase().includes(searchTerm) || 
                n.content.toLowerCase().includes(searchTerm)
            );

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <span>📭</span>
                        <p>Hiç not bulunamadı.</p>
                    </div>
                `;
                return;
            }

            const categoryLabels = {
                acil: '🚨 Acil',
                klinik: '🩺 Klinik',
                idari: '📋 İdari',
                kisisel: '💡 Kişisel'
            };

            let html = '';
            filtered.forEach(note => {
                html += `
                    <div class="note-item">
                        <div>
                            <div class="note-header">
                                <span class="note-title">${this.escapeHtml(note.title)}</span>
                                <span class="note-badge badge-${note.category}">${categoryLabels[note.category] || 'Diğer'}</span>
                            </div>
                            <div class="note-body" style="margin-top: 10px;">${this.escapeHtml(note.content)}</div>
                        </div>
                        <div class="note-footer">
                            <span>${note.date}</span>
                            <div class="note-actions">
                                <button class="icon-btn" onclick="app.shareNote(${note.id})" title="Paylaş / Kopyala">📤</button>
                                <button class="icon-btn" onclick="app.openEditor(${note.id})" title="Düzenle">✏️</button>
                                <button class="icon-btn delete" onclick="app.deleteNote(${note.id})" title="Sil">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
        }

        escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    }

    const app = new NoteApp();
    window.addEventListener('DOMContentLoaded', () => {
        app.render();
    });
</script>

</body>
</html>
